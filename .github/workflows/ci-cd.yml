# Test write - verify it works
name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  API_IMAGE: frictionless-api
  WORKER_IMAGE: frictionless-worker
  CHROMADB_IMAGE: frictionless-chromadb
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      api-tag: ${{ steps.meta.outputs.tags }}
      worker-tag: ${{ steps.meta-worker.outputs.tags }}
      chromadb-tag: ${{ steps.meta-chromadb.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd scripts
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          cd scripts
          python -m pytest test_frictionless.py test_verify.py -v --tb=short

      - name: Run integration test
        run: |
          cd scripts
          python -c "
import frictionless as fr
import gate
print('Basic import test passed')
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.API_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (Worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.WORKER_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (ChromaDB)
        id: meta-chromadb
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHROMADB_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Worker Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}

      - name: Build and push ChromaDB Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./chroma
          push: true
          tags: ${{ steps.meta-chromadb.outputs.tags }}
          labels: ${{ steps.meta-chromadb.outputs.labels }}

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.NAS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Synology NAS
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_USER: ${{ secrets.NAS_USER }}
          API_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.API_IMAGE }}:${{ needs.build-test.outputs.api-tag }}
          WORKER_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.WORKER_IMAGE }}:${{ needs.build-test.outputs.worker-tag }}
          CHROMADB_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHROMADB_IMAGE }}:${{ needs.build-test.outputs.chromadb-tag }}
        run: |
          ssh ${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }} "
            docker pull ${{ env.API_IMAGE }}
            docker pull ${{ env.WORKER_IMAGE }}
            docker pull ${{ env.CHROMADB_IMAGE }}
            docker stop frictionless-api frictionless-worker frictionless-chromadb || true
            docker rm frictionless-api frictionless-worker frictionless-chromadb || true
            docker run -d --name frictionless-chromadb -p 8000:8000 -v /volume1/docker/frictionless/chroma:/chroma/chroma ${{ env.CHROMADB_IMAGE }}
            docker run -d --name frictionless-worker -e CHROMADB_HOST=host.docker.internal -e CHROMADB_PORT=8000 ${{ env.WORKER_IMAGE }}
            docker run -d --name frictionless-api -p 8088:8088 -e CHROMADB_HOST=host.docker.internal -e CHROMADB_PORT=8000 ${{ env.API_IMAGE }}
            echo 'Deployment completed'
          "
