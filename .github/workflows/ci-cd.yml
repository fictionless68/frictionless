name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt
        pip install pytest pytest-cov
        
    - name: Run unit tests
      run: |
        python -m pytest scripts/test_frictionless.py -v
        python -m pytest scripts/test_verify.py -v
        
    - name: Run integration tests
      run: |
        python scripts/ingest_chromadb.py
        python -c "import chromadb; client = chromadb.PersistentClient(path='./chroma'); collections = client.list_collections(); print(f'Vector DB collections: {len(collections)}'); total_items = 0; [total_items := total_items + client.get_collection(col.name).count() for col in collections]; print(f'Total items: {total_items}')"
        
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push API image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.api
        push: true
        tags: sutazai/frictionless-api:latest
        
    - name: Build and push Worker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.worker
        push: true
        tags: sutazai/frictionless-worker:latest
        
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Synology NAS
      env:
        NAS_HOST: 192.168.100.250
        NAS_USER: ${{ secrets.NAS_USERNAME }}
        NAS_PASS: ${{ secrets.NAS_PASSWORD }}
      run: |
        sshpass -p $NAS_PASS ssh -o StrictHostKeyChecking=no $NAS_USER@$NAS_HOST "
          cd /volume1/docker/hermes/frictionless_brain &&
          docker-compose pull &&
          docker-compose up -d
        "
